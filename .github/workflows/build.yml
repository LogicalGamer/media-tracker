# Builds the Windows and Linux installers on GitHub's machines and attaches them
# to a draft release (GitHub → Releases). Run it from the Actions tab
# ("Build installers" → "Run workflow") or by pushing a tag like v0.2.0.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   VITE_PROXY_URL, VITE_PROXY_KEY  — same values as .env.local
name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write # needed to create the release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: ubuntu-22.04 # older Ubuntu = AppImage/.deb run on more Linux versions
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system libraries
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # baked into the app at build time (see src/lib/api/proxy.ts)
          VITE_PROXY_URL: ${{ secrets.VITE_PROXY_URL }}
          VITE_PROXY_KEY: ${{ secrets.VITE_PROXY_KEY }}
        with:
          tagName: v__VERSION__ # __VERSION__ = version from tauri.conf.json
          releaseName: Media Tracker v__VERSION__
          releaseBody: Download the installer for your system below.
          releaseDraft: true
          prerelease: false
